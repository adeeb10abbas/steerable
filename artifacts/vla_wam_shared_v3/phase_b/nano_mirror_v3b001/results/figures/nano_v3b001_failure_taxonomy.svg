<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="nano-v3b001-taxonomy-title nano-v3b001-taxonomy-desc"><title id="nano-v3b001-taxonomy-title">Nano V3-B001 failure taxonomy</title><desc id="nano-v3b001-taxonomy-desc">Stacked condition bars and full-cohort counts show every mutually exclusive outcome among 108 valid behavioral episodes, including zero-count categories.</desc><metadata>{&quot;amendment_id&quot;:&quot;V3-B001&quot;,&quot;exact_prompts&quot;:{&quot;left&quot;:&quot;Put the Rubik&#x27;s cube to the left of the bowl.&quot;,&quot;right&quot;:&quot;Put the Rubik&#x27;s cube to the right of the bowl.&quot;},&quot;failure_classes&quot;:[&quot;correct&quot;,&quot;pick_failed&quot;,&quot;transport_failed&quot;,&quot;wrong_side&quot;,&quot;release_failed&quot;],&quot;schema_version&quot;:&quot;vla-wam-shared-v3b-nano-v3b001-failure-taxonomy-figure-v1&quot;,&quot;source_sha256&quot;:{&quot;episodes&quot;:&quot;ce67aecb2705394e8161fa4b65df7130e62648e2f6d8b6a93408c8da685a7207&quot;,&quot;summary&quot;:&quot;f43636a03caade5f3dc65de6736808c8257c78eacb07ba4cb963bfc6a0e36578&quot;},&quot;study_id&quot;:&quot;vla_wam_language_steerability_v3&quot;}</metadata><style>.all{font-family:'Source Sans 3','Aptos','Segoe UI',Arial,sans-serif;fill:#1E2A33}.serif{font-family:'Source Serif 4','Iowan Old Style',Georgia,serif}.overline{font-size:14px;font-weight:700;letter-spacing:1.4px}.title{font-size:45px;font-weight:600;letter-spacing:-.6px}.subtitle{font-size:19px;fill:#5D6972}.prompt-label{font-size:13px;font-weight:700;letter-spacing:1px}.prompt{font-size:21px;font-weight:600}.section{font-size:25px;font-weight:650}.card-title{font-size:17px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#5D6972}.metric-name{font-size:15px;font-weight:700}.metric-value{font-size:14px;font-weight:650}.tick{font-size:12px;fill:#5D6972;font-variant-numeric:tabular-nums}.axis{font-size:13px;font-weight:600}.count{font-size:27px;font-weight:700}.footer{font-size:13px;fill:#5D6972}.footer-strong{font-size:13px;font-weight:700}.taxonomy-label{font-size:17px;font-weight:650}.taxonomy-count{font-size:15px;font-weight:700}</style><rect x="0" y="0" width="1440" height="1080" fill="#F5F2EC"/><g class="all"><text x="60" y="55" class="overline" fill="#377A68">NANO V3-B001 · FAILURE DECOMPOSITION</text><text x="60" y="112" class="title serif">What happened in the 108 valid episodes?</text><text x="60" y="148" class="subtitle">Mutually exclusive frozen taxonomy · infrastructure attempts remain outside the behavioral denominator</text><rect x="60" y="172" width="1320" height="64" rx="13" fill="#FFFDF9" stroke="#B8642B" stroke-width="1.2"/><text x="82" y="197" class="prompt-label" fill="#B8642B">LEFT PROMPT</text><text x="214" y="207" class="prompt">Put the Rubik&#x27;s cube to the left of the bowl.</text><rect x="60" y="248" width="1320" height="64" rx="13" fill="#FFFDF9" stroke="#2F6F9F" stroke-width="1.2"/><text x="82" y="273" class="prompt-label" fill="#2F6F9F">RIGHT PROMPT</text><text x="214" y="283" class="prompt">Put the Rubik&#x27;s cube to the right of the bowl.</text><rect x="60" y="340" width="16" height="16" rx="3" fill="#2F8068"/><text x="83" y="354" class="small">correct</text><rect x="310" y="340" width="16" height="16" rx="3" fill="#D1A04C"/><text x="333" y="354" class="small">pick failed</text><rect x="560" y="340" width="16" height="16" rx="3" fill="#B86A53"/><text x="583" y="354" class="small">transport failed</text><rect x="810" y="340" width="16" height="16" rx="3" fill="#875B8F"/><text x="833" y="354" class="small">wrong side</text><rect x="1060" y="340" width="16" height="16" rx="3" fill="#6D7885"/><text x="1083" y="354" class="small">release failed</text><text x="60" y="428" class="taxonomy-label" fill="#B8642B">Control · LEFT</text><text x="60" y="453" class="small">26/27 correct</text><rect x="390" y="404" width="905.185" height="48" fill="#2F8068"/><text x="842.593" y="435" class="taxonomy-count" fill="#FFFFFF" text-anchor="middle">26</text><rect x="1295.19" y="404" width="34.8148" height="48" fill="#B86A53"/><text x="1312.59" y="435" class="taxonomy-count" fill="#FFFFFF" text-anchor="middle">1</text><rect x="390" y="404" width="940" height="48" rx="6" fill="none" stroke="#D7D9D3" stroke-width="1.2"/><text x="60" y="520" class="taxonomy-label" fill="#2F6F9F">Control · RIGHT</text><text x="60" y="545" class="small">26/27 correct</text><rect x="390" y="496" width="905.185" height="48" fill="#2F8068"/><text x="842.593" y="527" class="taxonomy-count" fill="#FFFFFF" text-anchor="middle">26</text><rect x="1295.19" y="496" width="34.8148" height="48" fill="#6D7885"/><text x="1312.59" y="527" class="taxonomy-count" fill="#FFFFFF" text-anchor="middle">1</text><rect x="390" y="496" width="940" height="48" rx="6" fill="none" stroke="#D7D9D3" stroke-width="1.2"/><text x="60" y="612" class="taxonomy-label" fill="#B8642B">Position-reflected · LEFT</text><text x="60" y="637" class="small">27/27 correct</text><rect x="390" y="588" width="940" height="48" fill="#2F8068"/><text x="860" y="619" class="taxonomy-count" fill="#FFFFFF" text-anchor="middle">27</text><rect x="390" y="588" width="940" height="48" rx="6" fill="none" stroke="#D7D9D3" stroke-width="1.2"/><text x="60" y="704" class="taxonomy-label" fill="#2F6F9F">Position-reflected · RIGHT</text><text x="60" y="729" class="small">23/27 correct</text><rect x="390" y="680" width="800.741" height="48" fill="#2F8068"/><text x="790.37" y="711" class="taxonomy-count" fill="#FFFFFF" text-anchor="middle">23</text><rect x="1190.74" y="680" width="139.259" height="48" fill="#B86A53"/><text x="1260.37" y="711" class="taxonomy-count" fill="#FFFFFF" text-anchor="middle">4</text><rect x="390" y="680" width="940" height="48" rx="6" fill="none" stroke="#D7D9D3" stroke-width="1.2"/><text x="60" y="790" class="section">Full-cohort counts</text><rect x="60" y="814" width="240" height="104" rx="14" fill="#FFFDF9" stroke="#2F8068" stroke-width="1.3"/><text x="78" y="845" class="card-title" fill="#2F8068">correct</text><text x="78" y="890" class="count" fill="#2F8068">102</text><text x="128" y="889" class="small">of 108</text><rect x="324" y="814" width="240" height="104" rx="14" fill="#FFFDF9" stroke="#D1A04C" stroke-width="1.3"/><text x="342" y="845" class="card-title" fill="#D1A04C">pick failed</text><text x="342" y="890" class="count" fill="#D1A04C">0</text><text x="392" y="889" class="small">of 108</text><rect x="588" y="814" width="240" height="104" rx="14" fill="#FFFDF9" stroke="#B86A53" stroke-width="1.3"/><text x="606" y="845" class="card-title" fill="#B86A53">transport failed</text><text x="606" y="890" class="count" fill="#B86A53">5</text><text x="656" y="889" class="small">of 108</text><rect x="852" y="814" width="240" height="104" rx="14" fill="#FFFDF9" stroke="#875B8F" stroke-width="1.3"/><text x="870" y="845" class="card-title" fill="#875B8F">wrong side</text><text x="870" y="890" class="count" fill="#875B8F">0</text><text x="920" y="889" class="small">of 108</text><rect x="1116" y="814" width="240" height="104" rx="14" fill="#FFFDF9" stroke="#6D7885" stroke-width="1.3"/><text x="1134" y="845" class="card-title" fill="#6D7885">release failed</text><text x="1134" y="890" class="count" fill="#6D7885">1</text><text x="1184" y="889" class="small">of 108</text><line x1="60" y1="950" x2="1380" y2="950" stroke="#D7D9D3" stroke-width="1.4"/><text x="60" y="980" class="footer-strong">HOW TO READ</text><text x="175" y="980" class="footer">‘correct’ is the frozen requested-success outcome. Each valid episode appears exactly once; zero-count classes remain visible.</text><text x="60" y="1008" class="footer-strong">MEDIA LABELS</text><text x="175" y="1008" class="footer">Actual simulator rollout is executed behavior. A decoded local prediction is a per-request model future, not execution or an additional outcome.</text><text x="60" y="1036" class="footer-strong">BOUNDARY</text><text x="175" y="1036" class="footer">DROID/RoboLab only. No infrastructure attempt enters these 108 outcomes and no failure is converted to missing data or zero.</text></g></svg>