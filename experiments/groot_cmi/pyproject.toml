[project]
name = "steerable-groot-cmi-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "lerobot[groot]==0.6.0",
  "steerable-bridge-audit",
  "torch==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
steerable-bridge-audit = { path = "../..", editable = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
