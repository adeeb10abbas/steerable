apiVersion: batch/v1
kind: Job
metadata:
  name: sgw01-ali-evidence-reader-20260923aw
  namespace: 211247-prod
  labels: {owner: ali, app.kubernetes.io/name: sgw-01}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2100
  template:
    metadata:
      labels: {owner: ali, app.kubernetes.io/name: sgw-01, purpose: bounded-read-only-evidence-transfer}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: dcwipphhgc191.edc.nam.gm.com}
      tolerations:
        - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
      imagePullSecrets:
        - {name: artifactory-ci-pull-secret}
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: evidence-reader
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command:
            - /data/users/ali/vla_wam/envs/robolab-v2-isaac50/bin/python
            - -u
            - -c
            - |
              import json, os, time
              from datetime import datetime, timezone
              print(json.dumps({
                  "started_at_utc": datetime.now(timezone.utc).isoformat(),
                  "pod": os.environ["POD_NAME"], "pod_uid": os.environ["POD_UID"],
                  "purpose": "bounded read-only transfer of retained ali-owned study evidence",
                  "pvc_read_only": True, "allocated_gpus": 0,
                  "model_requests": 0, "behavioral_episodes": 0,
                  "lifetime_seconds": 1800,
              }), flush=True)
              time.sleep(1800)
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: NVIDIA_VISIBLE_DEVICES, value: "void"}
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsGroup: 2518800
            runAsNonRoot: true
            runAsUser: 816149040
          volumeMounts:
            - {name: workspace, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: 211247-prod-pvc}
        - name: tmp
          emptyDir: {}
