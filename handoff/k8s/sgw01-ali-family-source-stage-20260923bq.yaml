apiVersion: batch/v1
kind: Job
metadata:
  name: sgw01-ali-family-source-stage-20260923bq
  namespace: 211247-prod
  labels: {owner: ali, app.kubernetes.io/name: sgw-01}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3000
  template:
    metadata:
      labels: {owner: ali, app.kubernetes.io/name: sgw-01, purpose: finite-native-bbox-repair-stage}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: dcwipphhgc191.edc.nam.gm.com}
      tolerations:
        - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
      imagePullSecrets:
        - {name: artifactory-ci-pull-secret}
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stage
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              OUT=/data/users/ali/sgw-01/infrastructure/family-source-stage-20260923bq
              BASE=/data/users/ali/sgw-01/source/b429ddd
              TARGET=/data/users/ali/sgw-01/source/e43f5b40-bq
              SOURCE=e43f5b4054d1b65d192daa734fa9d99427b2eca3
              ROBOLAB=/data/users/ali/vla_wam/external/RoboLab-pi05-v3-0aef241
              PY=/data/users/ali/vla_wam/envs/robolab-v2-isaac50/bin/python
              test ! -e "$OUT"
              test ! -e "$TARGET"
              test "$(git -C "$BASE" rev-parse HEAD)" = b429ddd8c3e7be59f63759c1820e352029e48b8c
              test ! -e "$BASE/.git/objects/info/alternates"
              mkdir "$OUT"
              exec > >(tee "$OUT/stage.log") 2>&1
              for i in $(seq 1 180); do
                test ! -f "$OUT/transfer.complete" || break
                sleep 2
              done
              test -f "$OUT/transfer.complete"
              test "$(sha256sum "$OUT/update.bundle" | awk '{print $1}')" = 56cd331b5101342235daaa60a427d665b29596db9fb0374161f2f6a8139486a4
              git clone --shared --no-checkout "$BASE" "$TARGET"
              git -C "$TARGET" bundle verify "$OUT/update.bundle"
              git -C "$TARGET" fetch --no-tags "$OUT/update.bundle" HEAD
              git -C "$TARGET" checkout --detach "$SOURCE"
              test "$(git -C "$TARGET" rev-parse HEAD)" = "$SOURCE"
              test -z "$(git -C "$TARGET" status --porcelain)"
              test "$(git -C "$ROBOLAB" rev-parse HEAD)" = 0aef241fb088ca21bb4ebd24448940ed56620d17
              test -z "$(git -C "$ROBOLAB" status --porcelain --untracked-files=no)"
              cd "$TARGET"
              export PYTHONPATH="$TARGET"
              "$PY" tools/validate_vla_wam_v3_protocol.py --quiet
              "$PY" tools/validate_vla_wam_v2_protocol.py > "$OUT/v2-validation.json"
              "$PY" -m experiments.workshops.spatial_grounding_v1.family_campaign_executor --help > "$OUT/executor-help.txt"
              "$PY" - "$OUT" "$TARGET" <<'PY'
              from datetime import datetime, timezone
              import hashlib, json, os, sys
              from pathlib import Path
              out, source = map(Path, sys.argv[1:])
              def record(path):
                  return {"path": str(path), "bytes": path.stat().st_size,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
              def write(path, value):
                  with path.open("x") as stream:
                      json.dump(value, stream, indent=2, sort_keys=True, allow_nan=False)
                      stream.write("\n"); stream.flush(); os.fsync(stream.fileno())
              freeze = Path("/data/users/ali/sgw-01/infrastructure/family-source-stage-20260923bm/receipt.json")
              assert record(freeze)["sha256"] == "55b2dbbce2376b1c297180630238b09a83e8f226697f8da6a1814d748eebefd3"
              previous = Path("/data/users/ali/sgw-01/qualification/family-native-smoke-20260923bp")
              for index in range(4):
                  root = previous / str(index) / "evidence"
                  assert not list((root / "trials").glob("*/reset-*/action-*.npy"))
                  outcome = json.loads((root / "qualification.json").read_text())
                  assert outcome["status"] == "infrastructure_invalid_qualification"
                  assert "'list' object has no attribute 'detach'" in outcome["error"]
              template = source / "artifacts/workshops/spatial_grounding_v1/infrastructure/family-source-stage-20260923bo/native-smoke-bp.json"
              job = json.loads(template.read_text())
              job["metadata"]["name"] = "sgw01-ali-family-native-smoke-20260923br"
              job["spec"]["template"]["metadata"]["labels"]["purpose"] = "finite-native-bbox-repair"
              shell = job["spec"]["template"]["spec"]["containers"][0]["args"][0]
              substitutions = [
                  ["/source/c3c976db-bo", "/source/e43f5b40-bq", 1],
                  ["c3c976db56fd694d2c5498a8409b08f9a510a41c", "e43f5b4054d1b65d192daa734fa9d99427b2eca3", 2],
                  ["family-native-smoke-20260923bp", "family-native-smoke-20260923br", 1],
              ]
              for before, after, count in substitutions:
                  assert shell.count(before) == count, before
                  shell = shell.replace(before, after)
              job["spec"]["template"]["spec"]["containers"][0]["args"][0] = shell
              launcher = out / "native-smoke-br.json"
              write(launcher, job)
              receipt = {
                  "schema_version": "sgw-01-native-bbox-repair-stage-v1",
                  "source_commit": "e43f5b4054d1b65d192daa734fa9d99427b2eca3", "source_root": str(source),
                  "source_bundle": record(out / "update.bundle"), "unchanged_freeze": record(freeze),
                  "native_job_template": record(template), "native_repair_job": record(launcher),
                  "substitutions": substitutions, "job_uid": os.environ["JOB_UID"], "pod_uid": os.environ["POD_UID"],
                  "staged_at_utc": datetime.now(timezone.utc).isoformat(),
                  "allocated_gpus": 0, "model_requests": 0, "behavioral_episodes": 0, "release_permitted": False,
              }
              write(out / "receipt.json", receipt)
              print(json.dumps(receipt, sort_keys=True), flush=True)
              PY
              sync
              sleep 1800
          env:
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: CUDA_VISIBLE_DEVICES, value: ""}
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
            - name: JOB_UID
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsGroup: 2518800
            runAsNonRoot: true
            runAsUser: 816149040
          volumeMounts:
            - {name: workspace, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: 211247-prod-pvc}
        - name: tmp
          emptyDir: {}
