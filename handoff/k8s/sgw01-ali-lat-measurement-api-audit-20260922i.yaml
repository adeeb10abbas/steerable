  namespace: 211247-prod
  labels:
    owner: ali
    app.kubernetes.io/name: sgw-01
    app.kubernetes.io/managed-by: ali-research
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        owner: ali
        app.kubernetes.io/name: sgw-01
        purpose: read-only-lat-measurement-api-audit
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: artifactory-ci-pull-secret
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              ROBOLAB=/data/users/ali/vla_wam/external/RoboLab-pi05-v3-0aef241
              STUDY=/data/users/ali/sgw-01/source/b429ddd
              test "$(git -C "$ROBOLAB" rev-parse HEAD)" = 0aef241fb088ca21bb4ebd24448940ed56620d17
              test "$(git -C "$STUDY" rev-parse HEAD)" = b429ddd8c3e7be59f63759c1820e352029e48b8c
              test -z "$(git -C "$ROBOLAB" status --porcelain --untracked-files=no)"
              printf '%s\n' '=== robolab/core/world/world_state.py ==='
              sed -n '/def get_pose(/,/^    def /p;/def get_velocity(/,/^    def /p;/def get_bbox(/,/^    def /p' "$ROBOLAB/robolab/core/world/world_state.py"
              printf '%s\n' '=== scene and cube asset references ==='
              grep -R -n -E 'rubiks_cube|root_pos_w|root_lin_vel_w|root_ang_vel_w' \
                "$ROBOLAB/robolab" | sed -n '1,240p'
              printf '%s\n' '=== SGW capture and bridge call sites ==='
              grep -n -E 'get_pose|get_velocity|get_bbox|root_pos_w|root_lin_vel_w|root_ang_vel_w' \
                "$STUDY/experiments/workshops/spatial_grounding_v1/lat_workspace_capture.py" \
                "$STUDY/experiments/workshops/spatial_grounding_v1/robolab_lat_qualification.py"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsGroup: 2518800
            runAsNonRoot: true
            runAsUser: 816149040
          volumeMounts:
            - name: workspace
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/ali
            - name: userdb
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: userdb
              mountPath: /etc/group
              subPath: group
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: 211247-prod-pvc
            readOnly: true
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: userdb
          configMap:
            name: 211247-ali-b200-1gpu-userdb
