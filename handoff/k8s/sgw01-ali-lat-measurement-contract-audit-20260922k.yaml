              printf 'rigid_object_data.py=%s\nworld_state.py=%s\n' "$RIGID" "$WORLD"
              sha256sum "$RIGID" "$WORLD"
              printf '%s\n' '=== BEGIN rigid_object_data.py ==='
              cat "$RIGID"
              printf '%s\n' '=== END rigid_object_data.py ==='
              printf '%s\n' '=== BEGIN world_state.py ==='
              cat "$WORLD"
              printf '%s\n' '=== END world_state.py ==='
