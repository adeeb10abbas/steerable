          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              ROBOLAB=/data/users/ali/vla_wam/external/RoboLab-pi05-v3-0aef241
              STUDY=/data/users/ali/sgw-01/source/b429ddd
              ISAACLAB_ROOT=/data/users/ali/vla_wam/envs/robolab-v2-isaac50/lib/python3.11/site-packages/isaaclab
              WORLD="$ROBOLAB/robolab/core/world/world_state.py"
              test "$(git -C "$ROBOLAB" rev-parse HEAD)" = 0aef241fb088ca21bb4ebd24448940ed56620d17
              test "$(git -C "$STUDY" rev-parse HEAD)" = b429ddd8c3e7be59f63759c1820e352029e48b8c
              test -f "$WORLD"
              mapfile -t rigid_matches < <(find "$ISAACLAB_ROOT" -type f -name rigid_object_data.py -print | sort)
