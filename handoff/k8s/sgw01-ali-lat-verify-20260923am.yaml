                  "producer_start_time": "2026-09-23T01:24:09Z",
                  "producer_deadline_plus_grace_utc": "2026-09-23T06:29:09Z",
                  "allocated_gpus": 0, "model_requests": 0, "behavioral_episodes": 0,
                  "raw_evidence_access": "read_only_by_verifier_no_trial_reexecution",
              }
              with (Path(sys.argv[1]) / "start.json").open("x") as stream:
                  json.dump(value, stream, indent=2, sort_keys=True)
                  stream.write("\n")
              print(json.dumps(value), flush=True)
              PY
              exec "$PY" -u -m experiments.workshops.spatial_grounding_v1.qualification_batch_verifier \
                --plan artifacts/workshops/spatial_grounding_v1/qualification_batches/lat-remaining-20260923.json \
