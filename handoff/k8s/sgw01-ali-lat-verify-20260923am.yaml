              PY=/data/users/ali/vla_wam/envs/robolab-v2-isaac50/bin/python
              test "$(git -C "$SOURCE" rev-parse HEAD)" = f678e34e8cd570563dfb00b934b794ae75bb6d84
              test -z "$(git -C "$SOURCE" status --porcelain)"
              test -f /data/users/ali/sgw-01/infrastructure/source-stage-20260923al/receipt.json
              mkdir -p /data/users/ali/sgw-01/verification
              mkdir "$OUT"
              exec > >(tee "$OUT/verification.log") 2>&1
              export PYTHONPATH="$SOURCE"
              cd "$SOURCE"
              "$PY" - "$OUT" <<'PY'
              from datetime import datetime, timezone
              import json
              import os
              from pathlib import Path
              import sys
              value = {
                  "started_at_utc": datetime.now(timezone.utc).isoformat(),
                  "pod": os.environ["POD_NAME"], "pod_uid": os.environ["POD_UID"],
