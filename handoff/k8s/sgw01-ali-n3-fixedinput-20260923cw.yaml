apiVersion: batch/v1
kind: Job
metadata:
  name: sgw01-ali-n3-fixedinput-20260923cw
  namespace: 211247-prod
  labels:
    owner: ali
    app.kubernetes.io/name: sgw-01
  annotations:
    sgw-01/source-commit: "383beb7447170a505d33059c6be46e9ba363ec58"
    sgw-01/registration-sha256: "efa2fa67f7b797f1d56b388aeecc595ab7598473c41b00a5e6fee9145e498919"
    sgw-01/allocation-authority: "SGW-OPS-002"
    sgw-01/scope: "six saved-input requests; zero behavioral episodes; no automatic retry"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        owner: ali
        app.kubernetes.io/name: sgw-01
        purpose: nonbehavioral-fixed-input
    spec:
      restartPolicy: Never
      schedulerName: sgw01-ali-n3-fixedinput-20260923cw
      priority: 0
      nodeName: dcwipphhgc223.edc.nam.gm.com
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: artifactory-ci-pull-secret
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixed-input
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              mkdir "$OUT"
              exec > >(tee "$OUT/job.log") 2>&1
              cd "$SOURCE"
              test "$(git rev-parse HEAD)" = 383beb7447170a505d33059c6be46e9ba363ec58
              test -z "$(git status --porcelain)"
              test "$(sha256sum "$REGISTRATION" | cut -d' ' -f1)" = efa2fa67f7b797f1d56b388aeecc595ab7598473c41b00a5e6fee9145e498919
              export PYTHONPATH="$SOURCE:$SGW01_NANO_SOURCE_ROOT"
              "$PY" tools/validate_vla_wam_v3_protocol.py --quiet
              "$PY" tools/validate_vla_wam_v2_protocol.py > "$OUT/v2-validation.json"
              "$PY" - "$OUT" <<'PY'
              from pathlib import Path
              import json, os, shutil, sys, time
              out=Path(sys.argv[1]); free=shutil.disk_usage(out).free; required=4144643440640
              receipt={"free_bytes":free,"required_free_bytes":required,"observed_at_unix":time.time(),"status":"passed" if free>=required else "blocked"}
              with (out/"storage.json").open("x") as f:
                  json.dump(receipt,f,indent=2); f.write("\n"); f.flush(); os.fsync(f.fileno())
              if free<required: raise RuntimeError("persistent storage reserve unavailable")
              PY
              CUDA_VISIBLE_DEVICES=$("$PY" -m experiments.workshops.spatial_grounding_v1.gpu_idle_probe --expected-count 1 --output "$OUT/idle.json")
              export CUDA_VISIBLE_DEVICES
              test "$(nvidia-smi --query-gpu=name --format=csv,noheader -i "$CUDA_VISIBLE_DEVICES")" = "NVIDIA B200"
              exec 9>"/data/users/ali/sgw-01/locks/gpu-$CUDA_VISIBLE_DEVICES.lock"
              flock --nonblock 9
              mkdir "$CLAIM"
              "$PY" - "$CLAIM" "$OUT" <<'PY'
              import json,os,sys
              from pathlib import Path
              from experiments.workshops.spatial_grounding_v1.family_campaign_executor import _fsync_json
              claim,out=map(Path,sys.argv[1:])
              _fsync_json(claim/"owner.json",{"pod_name":os.environ["POD_NAME"],"pod_uid":os.environ["POD_UID"],"source_commit":"383beb7447170a505d33059c6be46e9ba363ec58","registration_id":"SGW-N3-FIXED-20260923CW","idle":json.loads((out/"idle.json").read_text()),"maximum_model_requests":6,"behavioral_episodes":0})
              PY
              nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total,memory.used,utilization.gpu --format=csv,noheader > "$OUT/gpu-identity.csv"
              export XDG_CACHE_HOME="$OUT/cache" SGW01_NANO_OUTPUT_DIR="$OUT/native-loader"
              mkdir -p "$HOME/.cache" "$XDG_CACHE_HOME"
              set +e
              "$PY" -u -m experiments.workshops.spatial_grounding_v1.nano_fixed_input --registration "$REGISTRATION" --output "$OUT/evidence"
              RC=$?
              set -e
              "$PY" - "$OUT" "$RC" <<'PY'
              import sys,time
              from pathlib import Path
              from experiments.workshops.spatial_grounding_v1.family_campaign_executor import _fsync_json
              _fsync_json(Path(sys.argv[1])/"process-outcome.json",{"exit_code":int(sys.argv[2]),"completed_at_unix":time.time(),"behavioral_episodes":0,"request_count_authority":"evidence per-request intents/results and trace, never this launcher exit code","retry_permitted":False})
              PY
              sync
              exit "$RC"
          env:
            - {name: SOURCE, value: /data/users/ali/sgw-01/source/n3-fixedinput-20260923cw}
            - {name: REGISTRATION, value: /data/users/ali/sgw-01/source/n3-fixedinput-20260923cw/artifacts/workshops/spatial_grounding_v1/n3_fixed_input_20260923cw.json}
            - {name: OUT, value: /data/users/ali/sgw-01/infrastructure/n3-fixedinput-20260923cw/run}
            - {name: CLAIM, value: /data/users/ali/sgw-01/infrastructure/n3-fixedinput-20260923cw/request-owner}
            - {name: PY, value: /data/users/ali/vla_wam/envs/cosmos-nano-411d25b-v3-exact/bin/python}
            - {name: SGW01_NANO_SOURCE_ROOT, value: /data/users/ali/vla_wam/external/cosmos-framework-411d25b}
            - {name: SGW01_NANO_CHECKPOINT_PATH, value: /data/users/ali/vla_wam/checkpoints/cosmos3_nano_policy_droid}
            - {name: HOME, value: /home/ali}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          resources:
            requests: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 128Gi, nvidia.com/gpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 816149040
            runAsGroup: 2518800
          volumeMounts:
            - {name: workspace, mountPath: /data}
            - {name: dshm, mountPath: /dev/shm}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/ali}
            - {name: userdb, mountPath: /etc/passwd, subPath: passwd, readOnly: true}
            - {name: userdb, mountPath: /etc/group, subPath: group, readOnly: true}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: 211247-prod-pvc}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: userdb
          configMap: {name: 211247-ali-b200-1gpu-userdb}
