apiVersion: batch/v1
kind: Job
metadata:
  name: sgw01-ali-source-stage-20260923an
  namespace: 211247-prod
  labels: {owner: ali, app.kubernetes.io/name: sgw-01}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {owner: ali, app.kubernetes.io/name: sgw-01, purpose: offline-verifier-source-stage}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: dcwipphhgc191.edc.nam.gm.com}
      tolerations:
        - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
      imagePullSecrets:
        - {name: artifactory-ci-pull-secret}
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stage
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              OUT=/data/users/ali/sgw-01/infrastructure/source-stage-20260923an
              BASE=/data/users/ali/sgw-01/source/f678e34-al
              TARGET=/data/users/ali/sgw-01/source/042d235-an
              SOURCE=042d235cbd95104c940ac8982566d039643459f6
              PY=/data/users/ali/vla_wam/envs/robolab-v2-isaac50/bin/python
              test ! -e "$OUT"
              test ! -e "$TARGET"
              test "$(git -C "$BASE" rev-parse HEAD)" = f678e34e8cd570563dfb00b934b794ae75bb6d84
              mkdir "$OUT"
              exec > >(tee "$OUT/stage.log") 2>&1
              for attempt in {1..180}; do
                if test -f "$OUT/transfer.complete"; then break; fi
                sleep 2
              done
              test -f "$OUT/transfer.complete"
              test "$(sha256sum "$OUT/update.bundle" | awk '{print $1}')" = cf718aee64b27f03b1533f9ff261e7a7e7675de64ba798d9e054f73ef8130607
              git clone --shared --no-checkout "$BASE" "$TARGET"
              git -C "$TARGET" bundle verify "$OUT/update.bundle"
              git -C "$TARGET" fetch --no-tags "$OUT/update.bundle" HEAD
              git -C "$TARGET" checkout --detach "$SOURCE"
              test "$(git -C "$TARGET" rev-parse HEAD)" = "$SOURCE"
              test -z "$(git -C "$TARGET" status --porcelain)"
              cd "$TARGET"
              export PYTHONPATH="$TARGET"
              "$PY" -m experiments.workshops.spatial_grounding_v1.qualification_batch_verifier --help > "$OUT/verifier-cli.txt"
              "$PY" tools/validate_vla_wam_v3_protocol.py --quiet
              "$PY" tools/validate_vla_wam_v2_protocol.py > "$OUT/v2-validation.json"
              "$PY" - "$OUT" "$TARGET" <<'PY'
              from datetime import datetime, timezone
              import hashlib
              import json
              from pathlib import Path
              import sys
              from experiments.workshops.spatial_grounding_v1.qualification_batch_verifier import load_registration
              out, source = map(Path, sys.argv[1:])
              study = source / "artifacts/workshops/spatial_grounding_v1"
              load_registration(study / "qualification_batches/lat-remaining-20260923.json",
                                study / "proposals/lat-20260922.json",
                                study / "controller_calibrations/lat-closed-pad-20260923.json",
                                expected_plan_sha256="f5007f84d26f27946b38f2053ca7d640b56e50e92ae3d09a0261feb45f88275e")
              receipt = {
                  "status": "passed_exact_source_native_cpu_cli_and_frozen_registration",
                  "source_commit": "042d235cbd95104c940ac8982566d039643459f6",
                  "source_root": str(source),
                  "object_store_dependency": "/data/users/ali/sgw-01/source/f678e34-al",
                  "bundle_sha256": hashlib.sha256((out / "update.bundle").read_bytes()).hexdigest(),
                  "verifier_cli_sha256": hashlib.sha256((out / "verifier-cli.txt").read_bytes()).hexdigest(),
                  "completed_at_utc": datetime.now(timezone.utc).isoformat(),
                  "model_requests": 0, "allocated_gpus": 0, "simulator_created": False,
              }
              with (out / "receipt.json").open("x") as stream:
                  json.dump(receipt, stream, indent=2, sort_keys=True)
                  stream.write("\n")
              print(json.dumps(receipt, sort_keys=True))
              PY
              sync
          env:
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsGroup: 2518800
            runAsNonRoot: true
            runAsUser: 816149040
          volumeMounts:
            - {name: workspace, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: 211247-prod-pvc}
        - name: tmp
          emptyDir: {}
