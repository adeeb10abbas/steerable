apiVersion: batch/v1
kind: Job
metadata:
  name: sgw01-ali-source-stage-20260923bh
  namespace: 211247-prod
  labels: {owner: ali, app.kubernetes.io/name: sgw-01}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {owner: ali, app.kubernetes.io/name: sgw-01, purpose: grounded-support-source-stage}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: dcwipphhgc191.edc.nam.gm.com}
      tolerations:
        - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
      imagePullSecrets:
        - {name: artifactory-ci-pull-secret}
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stage
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              OUT=/data/users/ali/sgw-01/infrastructure/source-stage-20260923bh
              BASE=/data/users/ali/sgw-01/source/b429ddd
              TARGET=/data/users/ali/sgw-01/source/5f7a091-bh
              SOURCE=5f7a0911b7384b98cc2094b4054ad75f9c3b226b
              ROBOLAB=/data/users/ali/vla_wam/external/RoboLab-pi05-v3-0aef241
              PY=/data/users/ali/vla_wam/envs/robolab-v2-isaac50/bin/python
              test ! -e "$OUT"
              test ! -e "$TARGET"
              test "$(git -C "$BASE" rev-parse HEAD)" = b429ddd8c3e7be59f63759c1820e352029e48b8c
              test ! -e "$BASE/.git/objects/info/alternates"
              mkdir "$OUT"
              exec > >(tee "$OUT/stage.log") 2>&1
              for attempt in {1..180}; do
                if test -f "$OUT/transfer.complete"; then break; fi
                sleep 2
              done
              test -f "$OUT/transfer.complete"
              test "$(sha256sum "$OUT/update.bundle" | awk '{print $1}')" = 1b534716ed02bbc8a8396e95ad9a11f5abf5157d8754ba50ab1aec4fb79de856
              git clone --shared --no-checkout "$BASE" "$TARGET"
              git -C "$TARGET" bundle verify "$OUT/update.bundle"
              git -C "$TARGET" fetch --no-tags "$OUT/update.bundle" HEAD
              git -C "$TARGET" checkout --detach "$SOURCE"
              test "$(git -C "$TARGET" rev-parse HEAD)" = "$SOURCE"
              test -z "$(git -C "$TARGET" status --porcelain)"
              test "$(git -C "$ROBOLAB" rev-parse HEAD)" = 0aef241fb088ca21bb4ebd24448940ed56620d17
              test -z "$(git -C "$ROBOLAB" status --porcelain --untracked-files=no)"
              cd "$TARGET"
              export PYTHONPATH="$TARGET"
              "$PY" tools/validate_vla_wam_v3_protocol.py --quiet
              "$PY" tools/validate_vla_wam_v2_protocol.py > "$OUT/v2-validation.json"
              "$PY" - "$OUT" "$TARGET" "$ROBOLAB" <<'PY'
              from datetime import datetime, timezone
              import json, math, os, subprocess, sys
              from pathlib import Path
              from types import SimpleNamespace
              from experiments.workshops.spatial_grounding_v1.prospective_family_scene import build_overlay
              from experiments.workshops.spatial_grounding_v1.prospective_family_capture import _manifest, _validate_capture_bindings
              from experiments.workshops.spatial_grounding_v1.lat_workspace_capture import _record
              out, source, robolab = map(Path, sys.argv[1:])
              original = Path("/data/users/ali/sgw-01/infrastructure/source-stage-20260923be/prospective")
              expected = {
                  "height-left": "c770afb0c2105b0b4ab2ac4064dce0516848e0af97a69f15324f2bd4a460c4c6",
                  "height-right": "ac915b53de429117a6c72ea5cbcd63d934019e6bc0250eda9bc6a09ad2decef2",
                  "dist-left": "48c4c7cef9e70bf81bc4ea05ebc5de24fd2e2c50d18c1a91bab2517de0fcdf19",
                  "dist-right": "2f1202af695a54eb2c2e6405dfe38c36b0a23dc6554c9e14e34a76fd98e2965d",
              }
              bindings = SimpleNamespace(robolab_root=robolab, assets_manifest=Path("/data/users/ali/sgw-01/preflight/a40-20260922e/assets.json"))
              records = []
              for key, digest in expected.items():
                  original_path = original / f"{key}.manifest.json"
                  original_record = _record(original_path)
                  if original_record["sha256"] != digest:
                      raise ValueError("bf baseline manifest changed")
                  old = _manifest(original_path)
                  family, side = key.split("-")
                  workspace = json.loads(Path(old["base_workspace_receipt"]["path"]).read_text())
                  table_top = workspace["objects"]["table"]["bbox_env_local_max_xyz_m"][2]
                  new = build_overlay(
                      family=family.upper(), base_scene=Path(old["base_scene"]["path"]),
                      workspace_receipt=Path(old["base_workspace_receipt"]["path"]),
                      output=out / "prospective" / f"{key}.usda",
                      **{("upper_side" if family == "height" else "bowl_side"): side},
                  )
                  if old["counterbalance"] != new["counterbalance"]:
                      raise ValueError("counterbalance changed during grounding repair")
                  before, after = old["prospective_design"], new["prospective_design"]
                  for field in ("authored_actor_root_overrides_env_local_xyz_m", "authored_actor_quaternion_overrides_wxyz"):
                      if set(after[field]) != set(before[field]) | {"banana"}:
                          raise ValueError("unexpected actor pose inventory change")
                      if any(after[field][name] != pose for name, pose in before[field].items()):
                          raise ValueError("scored actor pose changed during grounding repair")
                  if after["authored_actor_quaternion_overrides_wxyz"]["banana"] != workspace["objects"]["banana"]["root_quaternion_world_wxyz"]:
                      raise ValueError("banana orientation changed")
                  for a, b in zip(before["dimensions_and_poses"], after["dimensions_and_poses"], strict=True):
                      if a["name"] == "plate":
                          permitted = dict(a, display_color_rgb=[0.94, 0.94, 0.90])
                          if b != permitted:
                              raise ValueError("plate changed beyond disclosed color")
                      else:
                          if {k: v for k, v in a.items() if k not in {"center_m", "size_m"}} != {k: v for k, v in b.items() if k not in {"center_m", "size_m"}}:
                              raise ValueError("support identity, color or body flags changed")
                          if a["center_m"][:2] != b["center_m"][:2] or a["size_m"][:2] != b["size_m"][:2]:
                              raise ValueError("support XY footprint changed")
                          old_top = a["center_m"][2] + a["size_m"][2] / 2
                          new_top = b["center_m"][2] + b["size_m"][2] / 2
                          new_bottom = b["center_m"][2] - b["size_m"][2] / 2
                          if not math.isclose(old_top, new_top, rel_tol=0, abs_tol=1e-12) or not math.isclose(new_bottom, table_top, rel_tol=0, abs_tol=1e-12):
                              raise ValueError("support top changed or base is not grounded")
                  path = out / "prospective" / f"{key}.manifest.json"
                  with path.open("x") as f:
                      json.dump(new, f, indent=2, sort_keys=True)
                      f.write("\n")
                  _validate_capture_bindings(bindings, _manifest(path))
                  records.append({
                      "key": key, "bf_manifest": original_record, "repaired_manifest": _record(path),
                      "unchanged_scored_poses_top_planes_footprints_and_sides": True,
                      "support_bottom_z_m": table_top,
                      "banana_root": after["authored_actor_root_overrides_env_local_xyz_m"]["banana"],
                      "banana_placement_scope": "same prospective XY across families/sides; later translations leave banana fixed and screen actual clearance",
                  })
              receipt = {
                  "status": "passed_source_bound_grounded_support_revision_not_native_captured",
                  "amendment": "SGW-ENG-007", "source_root": str(source),
                  "source_commit": subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip(),
                  "bundle": _record(out / "update.bundle"), "baseline_revisions": records,
                  "object_store_dependency": str(source.parent / "b429ddd"), "alternate_store_depth": 1,
                  "completed_at_utc": datetime.now(timezone.utc).isoformat(),
                  "bounded_evidence_access_seconds_after_stage": 1200,
                  "allocated_gpus": 0, "model_requests": 0, "behavioral_episodes": 0,
                  "release_permitted": False,
              }
              with (out / "receipt.json").open("x") as f:
                  json.dump(receipt, f, indent=2, sort_keys=True)
                  f.write("\n")
                  f.flush()
                  os.fsync(f.fileno())
              print(json.dumps(receipt, sort_keys=True), flush=True)
              PY
              sync
              sleep 1200
          env:
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: CUDA_VISIBLE_DEVICES, value: ""}
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
          resources:
            requests: {cpu: "250m", memory: 4Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsGroup: 2518800
            runAsNonRoot: true
            runAsUser: 816149040
          volumeMounts:
            - {name: workspace, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: 211247-prod-pvc}
        - name: tmp
          emptyDir: {}
