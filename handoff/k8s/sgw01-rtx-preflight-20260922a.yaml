apiVersion: batch/v1
kind: Job
metadata:
  name: sgw01-ali-rtx-preflight-20260922a
  namespace: 211247-prod
  labels:
    owner: ali
    app.kubernetes.io/name: sgw-01
    app.kubernetes.io/managed-by: ali-research
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        owner: ali
        app.kubernetes.io/name: sgw-01
        purpose: zero-model-rtx-preflight
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 180
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker-gpu: ""
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition]
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      imagePullSecrets:
        - name: artifactory-ci-pull-secret
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              STUDY=/data/users/ali/sgw-01/source/cfd54d8
              ROBOLAB=/data/users/ali/vla_wam/external/RoboLab-pi05-v3-0aef241
              PY=/data/users/ali/vla_wam/envs/robolab-v2-isaac50/bin/python
              OUT=/data/users/ali/sgw-01/preflight/rtx-20260922a
              test ! -e "$OUT/renderer.log"
              mkdir -p "$OUT" "$HOME/.cache"
              exec > >(tee "$OUT/renderer.log") 2>&1
              test "$(git -C "$STUDY" rev-parse HEAD)" = cfd54d8563d2d14bcf7623e9001dbb3439eceee5
              test -z "$(git -C "$STUDY" status --porcelain)"
              test "$(git -C "$ROBOLAB" rev-parse HEAD)" = 0aef241fb088ca21bb4ebd24448940ed56620d17
              test -z "$(git -C "$ROBOLAB" status --porcelain --untracked-files=no)"
              cd "$STUDY"
              "$PY" tools/validate_vla_wam_v3_protocol.py --quiet
              "$PY" tools/validate_vla_wam_v2_protocol.py > "$OUT/v2_validation.json"
              nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total,memory.used,utilization.gpu --format=csv,noheader | tee "$OUT/gpu_identity.csv"
              nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader > "$OUT/gpu_processes_before.csv"
              test ! -s "$OUT/gpu_processes_before.csv"
              test -r "$VK_ICD_FILENAMES"
              export PYTHONPATH="$STUDY:$ROBOLAB"
              "$PY" -m experiments.workshops.spatial_grounding_v1.build_asset_manifest \
                --robolab-root "$ROBOLAB" --output "$OUT/assets.json"
              cd "$ROBOLAB"
              exec "$PY" -m experiments.workshops.spatial_grounding_v1.runtime_preflight \
                --study-root "$STUDY" --robolab-root "$ROBOLAB" \
                --assets-manifest "$OUT/assets.json" --output "$OUT/renderer.json" \
                --headless --num-envs 1 --device cuda:0 --renderer realtime \
                --rendering-type balanced
          env:
            - name: HOME
              value: /home/ali
            - name: USER
              value: ali
            - name: LOGNAME
              value: ali
            - name: TMPDIR
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,graphics,display
            - name: OMNI_KIT_ACCEPT_EULA
              value: "YES"
            - name: ACCEPT_EULA
              value: "Y"
            - name: VK_ICD_FILENAMES
              value: /etc/vulkan/icd.d/nvidia_icd.json
            - name: LD_LIBRARY_PATH
              value: /data/users/ali/vla_wam/envs/isaac-native-jammy-glvnd-1.4.0-1/usr/lib/x86_64-linux-gnu:/data/users/ali/vla_wam/envs/robolab-native-libs-ubuntu2204/usr/lib/x86_64-linux-gnu:/data/users/ali/vla_wam/envs/isaac-system-libs/lib
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsGroup: 2518800
            runAsNonRoot: true
            runAsUser: 816149040
          volumeMounts:
            - name: workspace
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: vartmp
              mountPath: /var/tmp
            - name: home
              mountPath: /home/ali
            - name: userdb
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: userdb
              mountPath: /etc/group
              subPath: group
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: 211247-prod-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: tmp
          emptyDir: {}
        - name: vartmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: userdb
          configMap:
            name: 211247-ali-b200-1gpu-userdb
