apiVersion: batch/v1
kind: Job
metadata:
  name: sgw01-ali-workspace-export-20260922h
  namespace: 211247-prod
  labels:
    owner: ali
    app.kubernetes.io/name: sgw-01
    app.kubernetes.io/managed-by: ali-research
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        owner: ali
        app.kubernetes.io/name: sgw-01
        purpose: read-only-workspace-receipt-export
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 20
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: artifactory-ci-pull-secret
      securityContext:
        fsGroup: 2518800
        supplementalGroups: [2518800]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: export
          image: artifactory-ci.gm.com/docker-approved/devcontainers/base@sha256:03f5ce7d090fbd378070a8216d0aedfc6e473c52da99b40b0cf53918612a297c
          command: ["/bin/bash", "-ec"]
          args:
            - |
              exec /data/users/ali/vla_wam/envs/robolab-v2-isaac50/bin/python - <<'PY'
              import base64
              import hashlib
              import json
              from pathlib import Path

              root = Path("/data/users/ali/sgw-01/qualification/lat-workspace-20260922g")
              files = {}
              for name in ("workspace.json", "gpu_selection.json", "gpu_identity.csv", "workspace.log"):
                  path = root / name
                  if path.stat().st_size > 1024 * 1024:
                      raise ValueError(f"compact export exceeds 1 MiB limit: {path}")
                  data = path.read_bytes()
                  files[name] = {
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "base64": base64.b64encode(data).decode("ascii"),
                  }
              print(json.dumps({"schema_version": "sgw-01-read-only-receipt-export-v1",
                                "raw_root": str(root), "files": files}))
              PY
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsGroup: 2518800
            runAsNonRoot: true
            runAsUser: 816149040
          volumeMounts:
            - name: workspace
              mountPath: /data
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: 211247-prod-pvc
            readOnly: true
