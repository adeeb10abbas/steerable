[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steerable-bridge-audit"
version = "0.1.0"
description = "Reproducible feasibility audit for a matched 2 x 2 Bridge language ablation"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["h5py>=3.10", "pytest>=7.4"]

[project.scripts]
steerable-res1 = "steerable_bridge.cli:main"
steerable-groot-cmi = "steerable_bridge.groot_cmi:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steerable_bridge"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
